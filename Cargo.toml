[package]
name = "wraith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A software KVM switch. One keyboard and mouse, every machine on the desk."
license.workspace = true
readme = "README.md"
keywords = ["kvm", "input", "wayland", "remote", "keyboard"]
categories = ["command-line-utilities", "network-programming"]
publish = ["crates-io", "xcrates"]

# No `repository` and no `homepage`. The source is not public, and a link that
# 404s is worse than no link: a published version keeps whichever it was given
# forever. The crate stands on its own, and the README is the whole of what a
# reader gets.
#
# An allowlist rather than an ignore list, so a file added later has to be named
# here before it ships. `research/` and the workspace furniture are outside the
# package and stay that way.
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

# docs.rs builds on Linux only, which would leave the whole macOS tree out of the
# published documentation.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[[bin]]
name = "wraith"
path = "src/main.rs"

[dependencies]
# Exact patch pins per the X manifesto. No silent minor or patch drift.
bitflags = { version = "=2.13.1", features = ["serde"] }
clap = { version = "=4.6.2", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
smallvec = { version = "=1.15.2", features = ["serde", "union"] }
mdns-sd = "=0.20.2"
ed25519-dalek = { version = "=3.0.0", features = ["rand_core", "pkcs8", "pem"] }
postcard = { version = "=1.1.3", features = ["use-std"] }
# Without platform-verifier, which drags in the Mozilla CA root bundle. Wraith
# pins identity keys and never consults the web PKI, so those roots would be
# several hundred kilobytes of certificates it must never trust.
quinn = { version = "=0.11.11", default-features = false, features = [
    "log",
    "runtime-tokio",
    "rustls-ring",
    "bloom",
] }
rand = "=0.10.2"
rcgen = { version = "=0.14.8", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "=0.23.42", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = "=0.11.0"
spake2 = "=0.4.0"
thiserror = "=2.0.18"
# Wipes the SPAKE2 shared key and the pairing code when they go out of scope.
# Both are secrets this crate creates and owns outright, so wiping them is the
# whole story rather than half of it.
zeroize = "=1.9.0"
tokio = { version = "=1.53.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
toml = "=1.1.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
# For getuid, and only that. The control socket's whole authorisation model is
# that its directory belongs to one user, and the environment cannot answer who
# that is: `UID` is a shell variable and no shell exports it.
libc = "=0.2.186"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "=0.31.14"
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
x11rb = { version = "=0.14.0", features = ["xtest", "xinput", "xfixes"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = ["NSPasteboard"] }
objc2-foundation = { version = "=0.3.2", features = ["NSString"] }
objc2-core-foundation = { version = "=0.3.2", features = ["CFRunLoop", "CFMachPort"] }
objc2-core-graphics = { version = "=0.3.2", features = [
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGDirectDisplay",
    "CGRemoteOperation",
] }

[features]
# Opens `wraith::internals` to this crate's own integration tests, which are a
# separate crate and would otherwise force `net` to be published surface. No
# consumer should enable it: nothing behind it is stable.
_internals = []

[dev-dependencies]
proptest = "=1.11.0"

[lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
# Catch debug leftovers before they reach a release.
dbg_macro = "deny"
todo = "deny"
# A wildcard requirement defeats the exact pinning above.
wildcard_dependencies = "deny"
# The domain models input state, and these fire constantly on newtype wrappers
# and small enums without saying anything useful about them.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# dx and dy are the universal names for a motion delta. Renaming them to satisfy
# the lint would make every signature that carries one worse.
similar_names = "allow"
# The docs name a lot of proper nouns that are not code items: XInput2, XWayland,
# CGEventTap, SPAKE2. Backticking them would read as though they were types.
doc_markdown = "allow"

# --- Appended by the public mirror -------------------------------------------
# The private crate inherits these from the monorepo workspace root. The public
# repo is the crate at its root, so it supplies its own workspace table for the
# four inherited fields and the release profile. `panic = "unwind"` is
# load-bearing: the drop guards that release a held key run during unwind.

[workspace]
resolver = "3"

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
